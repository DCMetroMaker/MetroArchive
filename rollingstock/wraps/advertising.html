<!DOCTYPE html>

<head>

    <title>Advertising Wraps - MetroArchive</title>

    <link rel="stylesheet" href="css/styles.css">

<body>

    <!-- Header gets inserted here -->
    <div id="header-placeholder"></div>
    
    <main>
        <h1>Advertising Wraps</h1>

        <hr>

        <h2>Full Car Ad Wraps</h2>
        <p>Since 2023, all sponsored advertising wraps have been on 7000-Series railcars. They do not wrap the M Logo on 7K cars.</p>
    
        <div class="image-grid-three">
            <figure>
                <img src="nats2023wrap.jpg">
                <figcaption>Washington Nationals Cherry Blossom 2023 Ad Wrap on 7088-7089 (April-May 2023)</figcaption>
            </figure>
            <figure>
                <img src="nats2024wrap.jpg">
                <figcaption>Washington Nationals Cherry Blossom 2024 Ad Wrap on 7738-7739 (April 2024)</figcaption>
            </figure>
            <figure>
                <img src="pennsylvaniawrap.jpg">
                <figcaption>Pennsylvania Ad Wrap on 7190-7191 (July-September 2024)</figcaption>
            </figure>
        </div>

        <div class="image-grid-three">
            <figure>
                <img src="crosswrap.jpg">
                <figcaption>Cross on Amazon Prime Ad Wrap on 7574-7575 (November-December 2024)</figcaption>
            </figure>
            <figure>
                <img src="leidoswrap.jpg">
                <figcaption>Leidos 2024 Ad Wrap on 7170-7171, 7356-7357, 7584-7585 (November 2024-February 2025)</figcaption>
            </figure>
            <figure>
                <img src="nats2025wrap.jpg">
                <figcaption>Washington Nationals 2025 Ad Wrap (April-May 2025)</figcaption>
            </figure>
        </div>

    <!-- Shared header loader -->
    <script src="js/loadHeader.js"></script>
