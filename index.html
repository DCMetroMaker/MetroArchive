<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MetroArchive</title>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, Helvetica, sans-serif;
    }

    body {
        background-color: #f4f4f4;
    }

    /* ===== HEADER ===== */
    header {
        width: 100%;
        box-shadow: 0 2px 8px rgba(0,0,0,0.12);
    }

    /* ===== TOP TITLE BAR ===== */
    .top-bar {
        background-color: white;
        padding: 0.65vw 2vw;
        border-bottom: 1px solid #d6d6d6;
    }

    .site-title {
        color: black;
        font-size: clamp(1.5rem, 2.2vw, 2.3rem);
        font-weight: bold;
        letter-spacing: 0.4px;
    }

    /* ===== NAVIGATION BAR ===== */
    nav {
        width: 100%;
        background-color: #24150f; /* darker brown */
    }

    .nav-menu {
        display: flex;
        list-style: none;
        width: 100%;
    }

    .nav-item {
        position: relative;
        flex: 1;
        text-align: center;
    }

    .nav-item > a {
        display: block;
        color: white;
        text-decoration: none;

        /* thinner bar */
        padding: 0.58vw 0.2vw;

        /* slightly larger bold font */
        font-size: clamp(0.82rem, 1.08vw, 1.08rem);
        font-weight: 700;

        white-space: nowrap;

        transition:
            background-color 0.2s ease,
            color 0.2s ease;
    }

    .nav-item > a:hover {
        background-color: #3a241b;
        color: #f3dbc7;
    }

    /* ===== DROPDOWNS ===== */
    .dropdown {
        position: absolute;
        top: 100%;
        left: 0;
        width: 100%;
        background-color: #2e1b13;
        display: none;
        flex-direction: column;
        z-index: 1000;
    }

    .dropdown a {
        color: white;
        text-decoration: none;

        padding: 0.7vw 0.5vw;

        font-size: clamp(0.72rem, 0.95vw, 0.95rem);
        font-weight: 600;

        border-top: 1px solid rgba(255,255,255,0.08);

        transition:
            background-color 0.2s ease,
            color 0.2s ease,
            padding-left 0.2s ease;
    }

    .dropdown a:hover {
        background-color: #493025;
        color: #ffe7d1;
        padding-left: 0.9vw;
    }

    .nav-item:hover .dropdown {
        display: flex;
    }

    /* ===== MOBILE ===== */
    @media (max-width: 700px) {

        .top-bar {
            padding: 10px 14px;
        }

        .nav-item > a {
            font-size: 0.72rem;
            padding: 8px 2px;
        }

        .dropdown a {
            font-size: 0.66rem;
            padding: 8px 4px;
        }
    }

    main {
        padding: 40px;
    }
</style>
</head>

<body>

<header>

    <!-- TITLE BAR -->
    <div class="top-bar">
        <div class="site-title">MetroArchives</div>
    </div>

    <!-- NAVIGATION -->
    <nav>
        <ul class="nav-menu">

            <li class="nav-item">
                <a href="#">Home</a>
            </li>

            <li class="nav-item">
                <a href="#">Rolling Stock</a>

                <div class="dropdown">
                    <a href="#">Image Rosters</a>
                    <a href="#">Fleet</a>
                    <a href="#">Mockups</a>
                    <a href="#">Work Vehicles</a>
                </div>
            </li>

            <li class="nav-item">
                <a href="#">System</a>

                <div class="dropdown">
                    <a href="#">Stations</a>
                    <a href="#">Yards</a>
                    <a href="#">Other</a>
                </div>
            </li>

            <li class="nav-item">
                <a href="#">Pennants</a>
            </li>

            <li class="nav-item">
                <a href="#">Fare Cards</a>
            </li>

            <li class="nav-item">
                <a href="#">About</a>
            </li>

        </ul>
    </nav>

</header>

<main>
    <h1>Welcome to MetroArchive</h1>
</main>

</body>
</html>
