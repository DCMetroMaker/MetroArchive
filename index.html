<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MetroArchive</title>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, Helvetica, sans-serif;
    }

    body {
        background-color: #f4f4f4;
    }

    /* HEADER */
    header {
        width: 100%;
        background-color: #1f1f1f;
        color: white;
        box-shadow: 0 2px 8px rgba(0,0,0,0.25);
    }

    /* TOP TITLE ROW */
    .top-bar {
        padding: 20px 30px;
        border-bottom: 1px solid #3a3a3a;
    }

    .site-title {
        font-size: 2.2rem;
        font-weight: bold;
        letter-spacing: 1px;
    }

    /* NAVIGATION ROW */
    nav {
        width: 100%;
    }

    .nav-menu {
        display: flex;
        list-style: none;
        width: 100%;
    }

    .nav-item {
        position: relative;
        flex: 1;
        text-align: center;
        background-color: #2b2b2b;
        transition: background-color 0.25s ease;
    }

    .nav-item > a {
        display: block;
        padding: 16px 10px;
        color: white;
        text-decoration: none;
        font-size: 1rem;
        transition: all 0.25s ease;
    }

    .nav-item:hover {
        background-color: #404040;
    }

    .nav-item > a:hover {
        color: #87c7ff;
    }

    /* DROPDOWN */
    .dropdown {
        position: absolute;
        top: 100%;
        left: 0;
        width: 100%;
        background-color: #333;
        display: none;
        flex-direction: column;
        z-index: 1000;
        border-top: 1px solid #555;
    }

    .dropdown a {
        padding: 12px;
        color: white;
        text-decoration: none;
        border-bottom: 1px solid #444;
        transition: background-color 0.2s ease,
                    color 0.2s ease,
                    padding-left 0.2s ease;
    }

    .dropdown a:hover {
        background-color: #4c4c4c;
        color: #87c7ff;
        padding-left: 18px;
    }

    .nav-item:hover .dropdown {
        display: flex;
    }

    /* Optional page spacing */
    main {
        padding: 40px;
    }
</style>
</head>

<body>

<header>

    <!-- TOP TITLE -->
    <div class="top-bar">
        <div class="site-title">MetroArchives</div>
    </div>

    <!-- NAVIGATION -->
    <nav>
        <ul class="nav-menu">

            <li class="nav-item">
                <a href="#">Home</a>
            </li>

            <li class="nav-item">
                <a href="#">Rolling Stock</a>

                <div class="dropdown">
                    <a href="#">Image Rosters</a>
                    <a href="#">Fleet</a>
                    <a href="#">Mockups</a>
                    <a href="#">Work Vehicles</a>
                </div>
            </li>

            <li class="nav-item">
                <a href="#">System</a>

                <div class="dropdown">
                    <a href="#">Stations</a>
                    <a href="#">Yards</a>
                    <a href="#">Other</a>
                </div>
            </li>

            <li class="nav-item">
                <a href="#">Pennants</a>
            </li>

            <li class="nav-item">
                <a href="#">Fare Cards</a>
            </li>

            <li class="nav-item">
                <a href="#">About</a>
            </li>

        </ul>
    </nav>

</header>

<main>
    <h1>Metro Archive TBD</h1>
</main>

</body>
</html>
