<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <base href="/MetroArchive/">

    <title>SmarTrip Cards - MetroArchive</title>

    <link rel="stylesheet" href="css/styles.css">
</head>

<body>

    <!-- Header gets inserted here -->
    <div id="header-placeholder"></div>
    
    <main>
        <h1>Opening Day & Groundbreaking Pennants</h1>
        <p>A list of every opening day or groundbreaking pennant.</p>

        <hr>
        
        <h2>Opening Day Pennants</h2>
        <div class="image-grid-four">
            <figure>
                <div class="image-wrapper">
                    <img src="img/pennant_op_red.png">
                </div>
                <figcaption>Washington Metro & Red Line Opening Day (3/27/76)</figcaption>
            </figure>
            <figure>
                <div class="image-wrapper">
                    <img src="img/pennant_op_blue_1.png">
                </div>
                <figcaption>Blue Line DC Phase II Opening Day (7/4/77)</figcaption>
            </figure>
            <figure>
                <div class="image-wrapper">
                    <img src="img/pennant_op_blue_2.png">
                </div>
                <figcaption>Blue Line Virginia Opening Day (7/4/77)</figcaption>
            </figure>
            <figure>
                <div class="image-wrapper">
                    <img src="img/pennant_op_brookland.png">
                </div>
                <figcaption>Red Line Brookland Opening Day (2/6/78)</figcaption>
            </figure>
            <figure>
                <div class="image-wrapper">
                    <img src="img/pennant_op_fttotten.png">
                </div>
                <figcaption>Red Line Fort Totten Opening Day (2/6/78)</figcaption>
            </figure>
            <figure>
                <div class="image-wrapper">
                    <img src="img/pennant_op_takoma.png">
                </div>
                <figcaption>Red Line Takoma Opening Day (2/6/78)</figcaption>
            </figure>
            <figure>
                <div class="image-wrapper">
                    <img src="img/pennant_op_montgomery.png">
                </div>
                <figcaption>Red Line to Silver Spring Motgomery County Opening Day (2/6/78)</figcaption>
            </figure>
        </div>

        <hr>
        
        
    </main>

    <!-- Shared header loader -->
    <script src="js/loadHeader.js"></script>

</body>

</html>
